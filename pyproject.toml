[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nova"
version = "0.1.0"
description = "NOVA - a local, voice-driven command-center desktop AI assistant for Windows."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "NOVA" }]
keywords = ["assistant", "voice", "desktop", "windows", "local-first"]

# Always-installed core. Heavy subsystems are opt-in extras so that the
# skeleton, tests and CI never need to pull Qt/whisper/GPU-sized wheels.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "platformdirs>=4.3",
    "python-dotenv>=1.0",
    "keyring>=25.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
brain = ["google-genai>=2.0,<3.0"]
voice = ["elevenlabs>=2.0", "faster-whisper>=1.1", "sounddevice>=0.5", "numpy>=2.0"]
ui = ["PySide6>=6.8"]
tools = [
    "psutil>=6.0",
    "pywinauto>=0.6.8",
    "pygetwindow>=0.0.9",
    "pyperclip>=1.9",
    "mss>=9.0",
    "Pillow>=10.4",
    "feedparser>=6.0",
]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]
all = ["nova[brain,voice,ui,tools]"]

[project.scripts]
nova = "nova.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/nova"]
